{% extends "base.html" %}
{% block content %}

<style>
  /* --- Tema Premium Clinica ZAH - Aliniere Simetrica --- */
  .sqli-header { margin-bottom: 30px; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .sqli-header h1 { color: #00d4aa; font-size: 32px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px; }
  .sqli-header p { color: #7aadcc; margin: 0; font-size: 15px; }

  .sqli-card {
    background: #0f2638;
    border: 1px solid #1a3348;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
  }

  .sqli-card h3 {
    color: #cce8ff;
    font-size: 16px;
    margin-top: 0;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #1a3348;
    font-weight: 600;
  }

  /* 1. Grila fortata la 4 coloane perfect egale */
  .sqli-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 24px;
  }

  /* Ajustare pentru ecrane mai mici */
  @media (max-width: 900px) { .sqli-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .sqli-grid { grid-template-columns: 1fr; } }

  .sqli-field label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #7aadcc;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* 3. Toate elementele interactive au exact 44px inaltime */
  .sqli-field select, .sqli-field input, .sqli-btn {
    height: 44px;
    box-sizing: border-box;
  }

  .sqli-field select, .sqli-field input {
    width: 100%;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid #1a3348;
    background: #0b1e2d;
    color: #cce8ff;
    font-size: 14px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .sqli-field input::placeholder { color: #4a667a; }
  .sqli-field select:focus, .sqli-field input:focus {
    border-color: #00d4aa;
    outline: none;
    box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.15);
  }

  .sqli-actions { display: flex; gap: 12px; }
  .sqli-btn {
    background: #00d4aa;
    color: #0b1e2d;
    border: none;
    padding: 0 24px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .sqli-btn:hover { background: #00e6b8; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0, 212, 170, 0.2); }
  .sqli-btn.clear { background: #1a3348; color: #cce8ff; }
  .sqli-btn.clear:hover { background: #244762; }

  /* Containerele pentru output (SQL si Status) */
  .sqli-code, .sqli-status {
    background: #0b1e2d;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid #1a3348;
    border-left: 4px solid #1a3348;
    margin: 0;
  }
  .sqli-code {
    font-family: 'Consolas', 'Courier New', monospace;
    color: #00d4aa;
    white-space: pre-wrap;
    word-break: break-all;
    border-left-color: #00d4aa;
    line-height: 1.5;
  }

  .sqli-status { font-weight: 600; color: #7aadcc; display: flex; align-items: center; min-height: 24px; }
  .sqli-status.ok { color: #00d4aa; border-left-color: #00d4aa; background: rgba(0, 212, 170, 0.05); }
  .sqli-status.warn { color: #f59e0b; border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.05); }
  .sqli-status.error { color: #ef4444; border-left-color: #ef4444; background: rgba(239, 68, 68, 0.05); }

  .sqli-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #1a3348; background: #0b1e2d; }
  .sqli-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .sqli-table th, .sqli-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #1a3348; }
  .sqli-table th { color: #7aadcc; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; background: #112a3f; }
  .sqli-table td { color: #cce8ff; }
  .sqli-table tr:last-child td { border-bottom: none; }
  .sqli-table tr:hover td { background: #1a3348; }
</style>

<div>
  <div class="sqli-header">
    <h1>SQL Injection Lab</h1>
    <p>Comută între <b>UNSAFE</b> (concatenează string) și <b>SAFE</b> (parametrizat). Vezi SQL-ul + rezultatul.</p>
  </div>

  <div class="sqli-card">
    <form id="labForm">
      <div class="sqli-grid">
        <div class="sqli-field">
          <label>Table</label>
          <select name="table" id="tableSel">
            {% for t in tables %}
              <option value="{{t.name}}">{{t.title}} ({{t.name}})</option>
            {% endfor %}
          </select>
        </div>

        <div class="sqli-field">
          <label>Field</label>
          <select name="field" id="fieldSel"></select>
        </div>

        <div class="sqli-field">
          <label>Value</label>
          <input name="value" id="valueInp" placeholder="ex: admin / SKU-001 / 1" />
        </div>

        <div class="sqli-field">
          <label>Mode</label>
          <select name="mode" id="modeSel">
            <option value="safe">SAFE (parameterized)</option>
            <option value="unsafe">UNSAFE (string concat)</option>
          </select>
        </div>
      </div>

      <div class="sqli-actions">
        <button type="submit" class="sqli-btn">Run query</button>
        <button type="button" id="clearBtn" class="sqli-btn clear">Clear</button>
      </div>
    </form>
  </div>

  <div class="sqli-card">
    <h3>Generated SQL</h3>
    <pre class="sqli-code" id="sqlOut" style="margin-bottom: 24px;">—</pre>

    <h3>Status</h3>
    <div id="statusOut" class="sqli-status">—</div>
  </div>

  <div class="sqli-card">
    <h3>Result</h3>
    <div class="sqli-table-wrap">
      <table class="sqli-table" id="resTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const TABLES = {{ tables|tojson }};
  const tableSel = document.getElementById("tableSel");
  const fieldSel = document.getElementById("fieldSel");
  const form = document.getElementById("labForm");
  const sqlOut = document.getElementById("sqlOut");
  const statusOut = document.getElementById("statusOut");
  const resTable = document.getElementById("resTable");
  const clearBtn = document.getElementById("clearBtn");

  function setFieldsForTable(tableName) {
    const t = TABLES.find(x => x.name === tableName);
    fieldSel.innerHTML = "";
    (t?.fields || []).forEach(f => {
      const opt = document.createElement("option");
      opt.value = f;
      opt.textContent = f;
      fieldSel.appendChild(opt);
    });
  }

  function renderTable(columns, rows) {
    const thead = resTable.querySelector("thead");
    const tbody = resTable.querySelector("tbody");
    thead.innerHTML = "";
    tbody.innerHTML = "";

    const trh = document.createElement("tr");
    columns.forEach(c => {
      const th = document.createElement("th");
      th.textContent = c;
      trh.appendChild(th);
    });
    thead.appendChild(trh);

    rows.forEach(r => {
      const tr = document.createElement("tr");
      r.forEach(v => {
        const td = document.createElement("td");
        td.textContent = (v === null || v === undefined) ? "" : String(v);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  tableSel.addEventListener("change", () => setFieldsForTable(tableSel.value));
  setFieldsForTable(tableSel.value);

  clearBtn.addEventListener("click", () => {
    sqlOut.textContent = "—";
    statusOut.textContent = "—";
    statusOut.className = "sqli-status";
    resTable.querySelector("thead").innerHTML = "";
    resTable.querySelector("tbody").innerHTML = "";
    document.getElementById("valueInp").value = "";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);

    statusOut.textContent = "Running...";
    statusOut.className = "sqli-status";

    try {
      const resp = await fetch("/api/sqli/query", { method: "POST", body: fd });
      const data = await resp.json();

      if (!data.ok) {
        sqlOut.textContent = data.sql || "—";
        statusOut.textContent = "Error: " + (data.error || "unknown");
        statusOut.className = "sqli-status error";
        renderTable([], []);
        return;
      }

      sqlOut.textContent = data.sql;
      statusOut.textContent = `OK • mode=${data.mode} • rows=${data.count}`;
      statusOut.className = data.mode === "unsafe" ? "sqli-status warn" : "sqli-status ok";
      renderTable(data.columns, data.rows);
    } catch (err) {
      statusOut.textContent = "Request failed. Check console.";
      statusOut.className = "sqli-status error";
      console.error(err);
    }
  });
</script>

{% endblock %}
