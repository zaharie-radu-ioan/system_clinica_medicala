{% extends "base.html" %}
{% block content %}

<div class="lab-root">
  <div class="lab-topbar">
    <div class="lab-badge">Lab</div>
    <h1 class="lab-title">SQL <span>Injection</span></h1>
    <div class="lab-subtitle">UNSAFE / SAFE mode · live query preview</div>
  </div>

  <div class="lab-body">
    <form id="labForm">
      <div class="lab-form-row">
        <div class="lab-field">
          <label>Table</label>
          <div class="select-wrap">
            <select class="lab-select" name="table" id="tableSel">
              {% for t in tables %}
                <option value="{{ t.name }}">{{ t.title }} ({{ t.name }})</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="lab-field">
          <label>Field</label>
          <div class="select-wrap">
            <select class="lab-select" name="field" id="fieldSel"></select>
          </div>
        </div>

        <div class="lab-field">
          <label>Value</label>
          <input class="lab-input" name="value" id="valueInp" placeholder="ex: admin / SKU-001 / 1" />
        </div>

        <div class="lab-field">
          <label>Mode</label>
          <div class="select-wrap">
            <select class="lab-select" name="mode" id="modeSel">
              <option value="safe">SAFE (parameterized)</option>
              <option value="unsafe">UNSAFE (string concat)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="lab-actions">
        <button type="submit" class="btn-run">▶ Run query</button>
        <button type="button" id="clearBtn" class="btn-clear">↺ Clear</button>
      </div>
    </form>

    <div class="lab-panels">
      <div class="lab-panel">
        <div class="panel-head">
          <span>Generated SQL</span>
        </div>
        <pre class="panel-body status-idle" id="sqlOut">— awaiting query —</pre>
      </div>

      <div class="lab-panel" id="statusPanel">
        <div class="panel-head">
          <span>Status</span>
        </div>
        <div class="panel-body status-idle" id="statusOut">— idle —</div>
      </div>
    </div>

    <div class="lab-result-panel">
      <div class="result-head">
        <div class="result-head-left">
          <span>Result</span>
        </div>
        <div id="rowCount"></div>
      </div>
      <div class="result-wrap">
        <div class="empty-state" id="emptyState">no data yet</div>
        <table class="lab-table" id="resTable" style="display:none">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const TABLES = {{ tables|tojson }};
  const tableSel  = document.getElementById("tableSel");
  const fieldSel  = document.getElementById("fieldSel");
  const form      = document.getElementById("labForm");
  const sqlOut    = document.getElementById("sqlOut");
  const statusOut = document.getElementById("statusOut");
  const statusPanel = document.getElementById("statusPanel");
  const resTable  = document.getElementById("resTable");
  const emptyState = document.getElementById("emptyState");
  const rowCount  = document.getElementById("rowCount");
  const clearBtn  = document.getElementById("clearBtn");

  function setFieldsForTable(tableName) {
    const t = TABLES.find(x => x.name === tableName);
    fieldSel.innerHTML = "";
    (t?.fields || []).forEach(f => {
      const opt = document.createElement("option");
      opt.value = f; opt.textContent = f;
      fieldSel.appendChild(opt);
    });
  }

  function setStatus(text, type) {
    statusOut.textContent = text;
    statusOut.className = "panel-body" + (type ? " status-" + type : " status-idle");
    statusPanel.className = "lab-panel" + (type ? " status-" + type : "");
  }

  function renderTable(columns, rows) {
    const thead = resTable.querySelector("thead");
    const tbody = resTable.querySelector("tbody");
    thead.innerHTML = ""; tbody.innerHTML = "";

    if (!columns.length) {
      resTable.style.display = "none";
      emptyState.style.display = "block";
      rowCount.textContent = "";
      return;
    }

    const trh = document.createElement("tr");
    columns.forEach(c => {
      const th = document.createElement("th");
      th.textContent = c;
      trh.appendChild(th);
    });
    thead.appendChild(trh);

    rows.forEach(r => {
      const tr = document.createElement("tr");
      r.forEach(v => {
        const td = document.createElement("td");
        td.textContent = (v === null || v === undefined) ? "" : String(v);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    resTable.style.display = "table";
    emptyState.style.display = "none";
    rowCount.textContent = rows.length + " rows";
  }

  tableSel.addEventListener("change", () => setFieldsForTable(tableSel.value));
  setFieldsForTable(tableSel.value);

  clearBtn.addEventListener("click", () => {
    sqlOut.textContent = "— awaiting query —";
    sqlOut.className = "panel-body status-idle";
    setStatus("— idle —", "");
    renderTable([], []);
    document.getElementById("valueInp").value = "";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    setStatus("Running...", "");

    try {
      const resp = await fetch("/api/sqli/query", { method: "POST", body: fd });
      const data = await resp.json();

      if (!data.ok) {
        sqlOut.textContent = data.sql || "—";
        sqlOut.className = "panel-body status-error";
        setStatus("Error: " + (data.error || "unknown"), "error");
        renderTable([], []);
        return;
      }

      sqlOut.textContent = data.sql;
      sqlOut.className = "panel-body status-ok";
      setStatus("✓  mode=" + data.mode + "  ·  rows=" + data.count, data.mode === "unsafe" ? "warn" : "ok");
      renderTable(data.columns, data.rows);
    } catch (err) {
      setStatus("Request failed. Check console.", "error");
      console.error(err);
    }
  });
</script>

{% endblock %}
